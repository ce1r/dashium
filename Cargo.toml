[package]
name = "dashium"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", default-features = false, features = [
    "http1",
    "json",
    "tokio",
    "tracing",
] }
axum-extra = { version = "0.12.6", default-features = false, features = [
    "form",
] }
base64 = "0.23.1"
bpaf = { version = "0.9.27", features = ["derive"] }
chacha20poly1305 = "0.11.0"
chrono = "0.4.45"
chrono-humanize = "0.2.3"
cornucopia = { path = "cornucopia" }
dotenvy = "0.15.7"
hex = "0.4.3"
rand = "0.10.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_with = "3.22.0"
sha1 = "0.11.0"
sha2 = "0.11.0"
shell-words = "1.1.1"
subtle = "2.6.1"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = [
    "fs",
    "macros",
    "net",
    "rt-multi-thread",
] }
tower-http = { version = "0.7.0", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
